<!-- Ползунок прозрачности -->
<div id="opacity-control" style="position: absolute; bottom: 30px; right: 10px; z-index: 1000; background: white; padding: 5px 10px; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.5); display: flex; align-items: center;">
    <label for="opacity-slider" style="margin-right: 8px; font-family: sans-serif; font-size: 12px;">Прозрачность:</label>
    <input type="range" id="opacity-slider" min="0" max="1" step="0.1" value="1" style="cursor: pointer;">
</div>

<script>
    window.addEventListener('load', function() {
        // ВАЖНО: Замените lyr_ВАШЕ_ИМЯ на имя из layers.js
        var layerToFade = lyr_ras_1; 
        var slider = document.getElementById('opacity-slider');
        slider.addEventListener('input', function(e) {
            var value = parseFloat(e.target.value);
            if (layerToFade) { layerToFade.setOpacity(value); }
        });
    });
</script>
